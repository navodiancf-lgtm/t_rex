<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-Rex Track Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <h1>🦖 T-Rex Track Viewer</h1>
    <div class="controls">
      <label class="btn">GPX chuno <input id="file" type="file" accept=".gpx,application/gpx+xml,text/xml" hidden></label>
      <button id="demo" class="btn" type="button">Demo track</button>
      <label>Sport <select id="sport"></select></label>
      <label>Weight (kg) <input id="weight" type="number" value="70" min="20" max="250"></label>
    </div>
  </header>
  <div id="stats"></div>
  <div id="legend" hidden>Heart rate: <span id="lo"></span> bpm <i></i> <span id="hi"></span> bpm</div>
  <div id="map"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="src/sports.js"></script>
  <script src="src/gpx.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
